<!doctype html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>OA PDF Downloader</title>
  <style>
    body { font-family: Segoe UI, Arial, sans-serif; margin: 16px; }
    .row { margin-bottom: 12px; }
    textarea { width: 100%; height: 160px; }
    input[type=text] { width: 520px; }
    #log { white-space: pre-wrap; background: #111; color: #eee; padding: 12px; height: 260px; overflow: auto; border-radius: 8px; }
    .btn { padding: 8px 12px; }
  </style>
</head>
<body>
  <h2>OA PDF Downloader</h2>

  <div class="row">
    <button class="btn" id="btnPick">Choose .docx/.xlsx</button>
    <span id="pickedFile"></span>
  </div>

  <div class="row">
    <div>Or paste references:</div>
    <textarea id="pasted" placeholder="Paste references here..."></textarea>
  </div>

  <div class="row">
    <label>Output root:</label>
    <input type="text" id="outputRoot" value="D:\\Papers" />
  </div>

  <div class="row">
    <label>Proxy (optional):</label>
    <input type="text" id="proxy" placeholder="http://127.0.0.1:7890" />
  </div>

  <div class="row">
    <label><input type="checkbox" id="resume" checked /> Resume from previous results.xlsx</label>
  </div>

  <div class="row">
    <button class="btn" id="btnStart">Start</button>
    <span id="status"></span>
  </div>

  <h3>Logs</h3>
  <div id="log"></div>

  <script src="renderer.js"></script>
</body>
</html>
